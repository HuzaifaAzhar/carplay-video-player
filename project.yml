name: CarVideo

options:
  bundleIdPrefix: com.huzaifa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    BASE_BUNDLE_ID: com.huzaifa.carvideo
    APP_DISPLAY_NAME: Car Video
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  CarVideo:
    type: application
    platform: iOS
    sources:
      - path: CarVideo
    settings:
      base:
        PRODUCT_NAME: CarVideo
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: CarVideo/CarVideo.entitlements
        ENABLE_PREVIEWS: YES
    info:
      path: CarVideo/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        # Videos live in the app's Documents folder, which shows up in the Files app as "Car Video".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocationWhenInUseUsageDescription: Used only while CarPlay is connected, to hide video on the car screen when the car is moving. Nothing is stored or sent anywhere.
        CFBundleURLTypes:
          - CFBundleURLName: $(BASE_BUNDLE_ID)
            CFBundleURLSchemes:
              - carvideo
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.mpeg-4
              - com.apple.quicktime-movie
              - com.apple.m4v-video
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).PhoneSceneDelegate
            # The car screen as a plain window scene (not a CarPlay template scene), so it can show
            # video and a web view and take touches. See CarSceneDelegate.
            UIWindowSceneSessionRoleCarPlay:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: UIWindowScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarSceneDelegate

schemes:
  CarVideo:
    build:
      targets:
        CarVideo: all
    run:
      config: Debug
    archive:
      config: Release
